name: Verify

on:
  push:
  pull_request:

jobs:
  core:
    name: Core verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python Scripts/verify_plugin_suites.py
