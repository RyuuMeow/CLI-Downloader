[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-downloader"
version = "0.1.0"
description = "A modular CLI download manager with site adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "CLI-Downloader contributors" }
]

dependencies = [
  "textual>=8.2.8,<9",
]

[project.urls]
Repository = "https://github.com/RyuuMeow/CLI-Downloader"

[project.optional-dependencies]
dev = [
  "ruff==0.15.20",
  "setuptools>=69",
]
package = [
  "pyinstaller==6.21.0",
]

[project.scripts]
clid = "cli_downloader.cli.app:main"

[tool.setuptools.packages.find]
include = ["cli_downloader*"]

[tool.setuptools.package-data]
"cli_downloader.cli.styles" = ["*.tcss"]
"cli_downloader.cli.locales" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
